[keys]
prefix = "ctrl+b"

# macOS-chord-friendly bindings. WezTerm translates cmd shortcuts into these
# raw prefix+key sequences, see home/.config/wezterm/wezterm.lua.
new_tab = "prefix+t"
close_pane = "prefix+w"
close_tab = "prefix+shift+w"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+r"
split_vertical = "prefix+d"
split_horizontal = "prefix+shift+d"
cycle_pane_next = "prefix+]"
cycle_pane_previous = "prefix+["
switch_tab = ""
switch_workspace = "prefix+1..9"

focus_pane_right = "prefix+l"
focus_pane_up = "prefix+k"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+h"
